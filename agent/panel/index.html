<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YORU · AI agent</title>
<meta name="description" content="Chat directly with YORU, your self-hosted AI agent." />
<link rel="stylesheet" href="/assets/panel.css" />
</head>
<body>
<canvas id="particles"></canvas>

<div class="shell">
  <header class="bar glass">
    <div class="brand">
      <div>
        <h1>YORU</h1>
        <small>self-hosted agent</small>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="pill"><span id="dotAgent" class="dot wait"></span><span id="agentText">connecting…</span></span>
    <button class="pill" id="pillProvider" type="button" style="cursor:pointer;border:0;background:transparent;color:inherit;font:inherit">provider —</button>
    <div id="providerPop" class="glass hidden" style="position:absolute;right:16px;top:64px;padding:14px;min-width:260px;z-index:50;border-radius:14px"></div>
    <button class="ghost sm" id="menuBtn" aria-label="Menu" style="padding:8px 10px">☰</button>
    <div id="menuPop" class="glass hidden" style="position:absolute;right:16px;top:64px;padding:10px;min-width:180px;z-index:51;border-radius:14px">
      <button class="ghost sm menu-item" data-pane="chat" style="width:100%;text-align:left">Chat</button>
      <button class="ghost sm menu-item" data-pane="code" style="width:100%;text-align:left">Code check</button>
      <button class="ghost sm menu-item" data-pane="email" style="width:100%;text-align:left">Email Forward</button>
    </div>
  </header>

  <div class="chat-wrap" id="chatWrap">
    <aside class="side glass">
      <div id="mascotBig"></div>
      <div class="muted" id="mood">Listening.</div>
      <div style="width:100%">
        <div class="pill" style="width:100%;justify-content:center;margin-bottom:8px"><span id="dotBot" class="dot"></span> Discord bot</div>
        <div class="pill" style="width:100%;justify-content:center;margin-bottom:8px"><span id="dotSelf" class="dot"></span> alt account</div>
        <div class="pill" style="width:100%;justify-content:center" id="pillOs">system —</div>
      </div>
      <div class="spacer"></div>
      <button class="ghost sm" id="clearBtn">Clear chat</button>
    </aside>

    <main class="stream glass">
      <div class="row" style="justify-content:flex-end;margin-bottom:12px">
        <a class="btn sm" href="#" id="ownerLink" style="text-decoration:none">Owner panel</a>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask YORU anything — or tell it to do something on this machine…"></textarea>
        <button class="primary" id="send">Send</button>
      </div>
    </main>
  </div>

  <!-- ============ Code check pane ============ -->
  <div class="chat-wrap hidden" id="codeWrap">
    <aside class="side glass" style="width:320px">
      <div class="field"><label>Project folder</label><input id="codePath" placeholder="/home/user/project"/></div>
      <button class="sm primary" id="codeOpen">Open / refresh</button>
      <div style="margin-top:12px;max-height:70vh;overflow:auto" id="codeTree"></div>
    </aside>
    <main class="stream glass">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <span class="pill">OpenClaw code auditor</span>
        <button class="sm primary" id="codeAudit">Audit all files</button>
      </div>
      <div id="codeEditor" class="code-editor" style="height:50vh;overflow:auto;border:1px solid var(--glass-strong);border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap"></div>
      <div class="composer" style="margin-top:12px">
        <input id="codeMsg" placeholder="Ask YORU to modify or explain the open file…" style="flex:1"/>
        <button class="primary" id="codeSend">Send</button>
      </div>
      <div id="codeAuditOut" style="margin-top:12px"></div>
    </main>
  </div>
  <!-- ============ Email Forward pane ============ -->
  <div class="chat-wrap hidden" id="emailWrap">
    <main class="stream glass" style="width:100%">
      <div class="row" style="justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap">
        <span class="pill">Email Forward · reads.phrack.org</span>
        <div class="row" style="gap:6px">
          <select id="emailOp" class="pill" style="padding:6px 10px;background:transparent;color:inherit;border:1px solid var(--glass-strong);border-radius:999px">
            <option value="analyze">Analyze (full report)</option>
            <option value="headers">Parse headers</option>
            <option value="urls">Extract URLs</option>
            <option value="attachments">List attachments</option>
            <option value="threat">Threat score</option>
            <option value="parse">Parse structure</option>
          </select>
          <button class="sm primary" id="emailSend">Run</button>
        </div>
      </div>
      <p class="muted" style="margin-top:0">Paste the full raw email (headers included if you have them). Pick an operation, hit <b>Run</b>.</p>
      <textarea id="emailInput" rows="12" placeholder="From: …&#10;Subject: …&#10;&#10;(paste the raw email here)" style="width:100%;font-family:ui-monospace,monospace;font-size:13px"></textarea>
      <div id="emailOut" style="margin-top:12px"></div>
    </main>
  </div>
</div>

<script type="module" src="/assets/chat.js"></script>
</body>
</html>
