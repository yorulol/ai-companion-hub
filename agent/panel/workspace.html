<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>YORU // WorkSpace</title><meta name="description" content="YORU and ACE collaborative project workspace."/><link rel="stylesheet" href="/assets/command.css"/><link rel="stylesheet" href="/assets/workspace.css"/></head><body class="workspace-body"><canvas id="particles"></canvas><div class="grid-noise"></div><main class="workspace-shell"><header class="workspace-bar"><div><span>YORU SYSTEMS</span><h1>WORKSPACE</h1></div><div class="workspace-path"><label>PROJECT ROOT</label><input id="rootPath"/><button id="setRoot">OPEN FOLDER</button></div><span class="security-state"><i id="dotAgent"></i><b id="agentText">CONNECTING</b></span></header><section class="workspace-grid"><aside class="workspace-files hud-panel"><div class="panel-label">PROJECT FILES <button id="fsUp">UP</button></div><div id="fsPath" class="breadcrumbs">.</div><div id="fsList" class="file-list"></div></aside><section class="workspace-main"><div class="workspace-controls hud-panel"><div><label>MISSION FOR YORU &amp; ACE</label><textarea id="task" rows="2" placeholder="Describe the outcome. Both agents can inspect and edit the selected project."></textarea></div><div><label>ROUNDS</label><input id="rounds" type="number" min="1" max="12" value="4"/></div><div><label>ACE PROVIDER</label><select id="aceProvider"><option value="openrouter">OpenRouter</option><option value="openclaw">OpenClaw</option></select></div><button id="run">RUN MISSION</button><button id="stop" class="hidden">STOP</button></div><div id="feed" class="workspace-feed hud-panel"><div class="workspace-empty">NO ACTIVE MISSION<br/><span>Choose a project folder and give the agents an objective.</span></div></div></section></section></main><script type="module" src="/assets/workspace.js"></script></body></html>
